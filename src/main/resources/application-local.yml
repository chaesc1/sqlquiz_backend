spring:
  datasource:
    url: jdbc:h2:mem:sqlquiz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console 접속 가능
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # 로컬에서는 앱 시작/종료 시 자동 생성/삭제

  flyway:
    enabled: false           # 로컬 H2에서는 Flyway 비활성화

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    sqlquiz: debug
    org.hibernate.SQL: debug

jwt:
  secret: local-dev-secret-key-minimum-256-bits-long-change-in-prod
  access-expiration: 900000      # 15분 (밀리초)
  refresh-expiration: 604800000  # 7일 (밀리초)