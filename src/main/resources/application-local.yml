spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sqlquiz
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:sqlquiz}
    password: ${DB_PASSWORD:sqlquiz}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate          # Flyway가 스키마를 관리하므로 검증만 수행
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false           # OSIV off (서비스 계층 외부 LAZY 로딩 방지)

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      # password: ${REDIS_PASSWORD:}  # 운영 시 활성화

# P6Spy 쿼리 로깅 — datasource-decorator 자동 구성.
#   logging=slf4j  → 우리 logback 파이프라인을 그대로 사용
#   multiline=false→ 한 줄로 압축 (운영용 가독성). 대신 format 으로 SQL 만 추출
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: false
      log-format: "[p6spy] %(executionTime)ms | %(category) | %(sqlSingleLine)"

server:
  port: 8080

# JWT
jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-minimum-256-bits-long-change-in-prod-xxxxxxxx}
  access-expiration: 900000        # 15분
  refresh-expiration: 604800000    # 7일

# Springdoc (Swagger UI)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html         # 접근: /swagger-ui/index.html 로도 진입 가능
    tags-sorter: alpha
    operations-sorter: alpha

# Logging
logging:
  level:
    sqlquiz: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace   # 바인딩 파라미터 출력 (운영에서는 끄기)
